    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d3b15f"/><stop offset="1" stop-color="#a78232"/></linearGradient>
  </defs>
  <rect width="800" height="500" rx="28" fill="url(#bg)"/>
  <path d="M0 100h800M0 200h800M0 300h800M0 400h800M100 0v500M200 0v500M300 0v500M400 0v500M500 0v500M600 0v500M700 0v500" stroke="#b8e2cf" stroke-opacity=".07"/>
